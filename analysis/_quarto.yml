format:
  html:
    embed-resources: true
    fig-align: center
    fig-dpi: 300
    fig-responsive: true
    number-sections: true
    number-depth: 3
    toc: true
    toc-depth: 3
    smooth-scroll: true
    theme: cosmo
    highlight-style: a11y
    code-tools: true
    code-links:
      - text: kbvernon/netc14
        icon: github
        href: https://github.com/kbvernon/netc14

execute:
  echo: true
  warning: false
  error: false